      contents: 'read'
      id-token: 'write'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up uv
        uses: astral-sh/setup-uv@v8.3.2
        with:
          enable-cache: true

      - name: Install build dependencies
        run: |
          uv pip install --system build setuptools wheel toml

      - name: Build wheels
        run: |
          chmod +x ./.github/scripts/build-all.sh
          ./.github/scripts/build-all.sh

      - name: Install packages and dev dependencies
        run: |
          uv pip install --system --prerelease=allow \
            -e './apptrace[dev,azure,aws,gcp,postgres]' \
            -e './test_tools[dev]'
              
      - uses: 'google-github-actions/auth@v3'
