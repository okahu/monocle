name: Run Monocle and Test-Tools Integration Tests

on:
  push:
    branches:
      - "main"
  pull_request:
    branches:
      - "**"
  workflow_dispatch:

# Define concurrency group based on workflow name
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false # Set to true if you want to cancel running workflows instead of queuing

jobs:
  Integration-Test:
    runs-on: ubuntu-latest
    environment: Stage
    env:
      AZURE_OPENAI_API_DEPLOYMENT: ${{ secrets.AZURE_OPENAI_API_DEPLOYMENT }}
      AZURE_OPENAI_API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY }}
