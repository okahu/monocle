      OPENSEARCH_ENDPOINT_URL_BOTO_SAGEMAKER: ${{ vars.OPENSEARCH_ENDPOINT_URL_BOTO_SAGEMAKER }}
      OPEN_SEARCH_AUTH_PASSWORD: ${{ secrets.OPEN_SEARCH_AUTH_PASSWORD }}
      OPEN_SEARCH_AUTH_USER: ${{ secrets.OPEN_SEARCH_AUTH_USER }}
