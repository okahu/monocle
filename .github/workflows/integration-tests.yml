      - name: Run test_tools Integration tests
        if: always()
        id: run-test-tools-integration-tests
        run: |
          cd test_tools
          export PYTHONPATH=./src:./tests
          set +e
          pytest -rfEs tests/integration/test*.py --tb=short | tee test_tools_integration_result.log
          EXIT_CODE=${PIPESTATUS[0]}
          echo "TEST_TOOLS_INTEGRATION_EXIT=$EXIT_CODE" >> $GITHUB_ENV
          grep -E '^(FAILED|ERROR) .*\.py' test_tools_integration_result.log | cut -d ':' -f 1 | sort | uniq > test_tools_integration_failed_files.txt
          echo "" >> failed_files.txt
          echo "Failed test_tools integration test files:"
          echo "Failed test_tools integration test files:" >> failed_files.txt
          cat ./test_tools_integration_failed_files.txt
          cat ./test_tools_integration_failed_files.txt >> failed_files.txt
          echo "" >> failed_files.txt
          LINE_NUM=$(grep -nE "===== .*((failed|passed|skipped|warnings|error).*)+ in .* ======" test_tools_integration_result.log | tail -1 | cut -d: -f1)
          if [[ -n "${LINE_NUM}" ]]; then
            tail -n +"${LINE_NUM}" ./test_tools_integration_result.log > test_tools_integration_test_summary.txt
          else
            cp test_tools_integration_result.log test_tools_integration_test_summary.txt
          fi
          echo "" >> test_summary.txt
          echo "test_tools Integration Test Summary:" >> test_summary.txt
          cat ./test_tools_integration_test_summary.txt >> test_summary.txt
          echo "" >> test_summary.txt
          exit $EXIT_CODE

      - name: Add test_tools Test Summary to Summary (Table)
        if: always()
        run: |
          cd test_tools
          if [[ -s ./test_tools_integration_test_summary.txt ]]; then
            {
              echo "### test_tools Integration Test Summary"
              echo ""
              echo "| test_tools Integration Test Summary |"
              echo "|-------------------------------------|"
              while read -r file; do
                echo "| $file |"
              done < test_tools_integration_test_summary.txt
            } >> $GITHUB_STEP_SUMMARY
          fi

      - name: Add test_tools Failed Files to Summary (Table)
        if: always()
        run: |
          cd test_tools
          if [[ "${TEST_TOOLS_INTEGRATION_EXIT}" == "0" ]]; then
            echo "### ✅ All test_tools integration tests passed!" >> $GITHUB_STEP_SUMMARY
          elif [[ -s ./test_tools_integration_failed_files.txt ]]; then
            {
              echo "### ❌ Failed test_tools Integration Test Files (pytest exit code ${TEST_TOOLS_INTEGRATION_EXIT})"
              echo ""
              echo "| Failed test_tools Integration Test File Path |"
              echo "|-----------------------------------------------|"
              while read -r file; do
                echo "| $file |"
              done < test_tools_integration_failed_files.txt
            } >> $GITHUB_STEP_SUMMARY
          else
            {
              echo "### ❌ test_tools integration tests FAILED (pytest exit code ${TEST_TOOLS_INTEGRATION_EXIT})"
              echo ""
              echo "No failed test files were captured — pytest did not run to completion (e.g. a collection/import error from a missing dependency). Check the \"Run test_tools Integration tests\" step logs."
            } >> $GITHUB_STEP_SUMMARY
          fi
