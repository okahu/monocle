      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      GCP_PROJECT: ${{ secrets.GCP_PROJECT }}
      GCP_REGION: ${{ secrets.GCP_REGION }}
      GITHUB_TOKEN: ${{ secrets.EXPORTER_GITHUB_TOKEN }}
      GOOGLE_GENAI_USE_VERTEXAI: True
      KNOWLEDGE_BASE_ID: ${{ vars.KNOWLEDGE_BASE_ID }}
      PROFILE_ARN: ${{ vars.PROFILE_ARN }}
      MONOCLE_GCS_BUCKET_NAME: ${{ vars.MONOCLE_GCS_BUCKET_NAME }}
      MONOCLE_GCS_LOCATION: ${{ vars.MONOCLE_GCS_LOCATION }}
      MONOCLE_GCS_PROJECT_ID: ${{ vars.MONOCLE_GCS_PROJECT_ID }}
      GOOGLE_CLOUD_PROJECT: ${{ vars.GOOGLE_CLOUD_PROJECT }}
